<div class="grid max-w-80 gap-4">
  <div class="cui-console-field">
    <label class="cui-console-field-label" for="project">Project Name</label>
    <input class="cui-console-field-input" id="project" value="Shop">
  </div>
  <div class="cui-console-field">
    <label class="cui-console-field-label" for="search">Search</label>
    <input class="cui-console-field-input" id="search" placeholder="is:unresolved level:error">
  </div>
  <div class="cui-console-field">
    <label class="cui-console-field-label" for="url">Webhook URL</label>
    <input class="cui-console-field-input" id="url" aria-invalid="true" aria-describedby="url-error" value="htp:/example">
    <p class="cui-console-field-error" id="url-error">Enter a URL that starts with https://.</p>
  </div>
  <div class="cui-console-field">
    <label class="cui-console-field-label" for="dsn">DSN</label>
    <input class="cui-console-field-input" id="dsn" value="https://key@crashcart.test/1" disabled>
  </div>
  <div class="cui-console-field">
    <label class="cui-console-field-label" for="note">Note</label>
    <textarea class="cui-console-field-input" id="note" rows="3" placeholder="What did you decide?"></textarea>
  </div>
</div>
