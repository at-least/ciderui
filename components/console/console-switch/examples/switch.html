<div class="grid gap-3">
  <label class="cui-console-switch">
    <input class="cui-console-switch-input" type="checkbox" role="switch" name="todo">
    <span class="cui-console-switch-track" aria-hidden="true"></span>
    Only what needs you
  </label>
  <label class="cui-console-switch">
    <input class="cui-console-switch-input" type="checkbox" role="switch" name="live" checked>
    <span class="cui-console-switch-track" aria-hidden="true"></span>
    Show live events
  </label>
  <label class="cui-console-switch">
    <input class="cui-console-switch-input" type="checkbox" role="switch" name="share" disabled>
    <span class="cui-console-switch-track" aria-hidden="true"></span>
    Share with every project
  </label>
</div>
