<fieldset class="grid gap-3">
  <legend class="cui-console-label">Kind</legend>
  <label class="cui-console-radio">
    <input class="cui-console-radio-input" type="radio" name="kind" value="service" checked>
    Service
    <span class="cui-console-radio-caption">A backend or a server. Listed under Services.</span>
  </label>
  <label class="cui-console-radio">
    <input class="cui-console-radio-input" type="radio" name="kind" value="app">
    App
    <span class="cui-console-radio-caption">A mobile or desktop app. Listed under Apps.</span>
  </label>
  <label class="cui-console-radio">
    <input class="cui-console-radio-input" type="radio" name="kind" value="job" disabled>
    Job
  </label>
</fieldset>
