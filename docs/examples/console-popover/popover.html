<div class="flex justify-center">
  <button type="button" class="cui-console-btn" popovertarget="pause-backup">Pause Until…</button>
  <form class="cui-console-popover" id="pause-backup" popover>
    <input class="cui-console-field" name="until" placeholder="+2h or 2026-10-29 20:00 (UTC)" aria-label="Pause until: a duration, or a UTC time">
    <button type="submit" class="cui-console-btn" data-variant="filled">Pause</button>
  </form>
</div>
