<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A nav's list as its own menu</title>
<style>
  /* globalnav.css's techniques at their smallest: the list is a popover the
     page shows closed, as the bar's row; its button, inside it, opens it
     into a sheet over the window, its rows coming in, its lines turning into
     an X */
  html, body { margin: 0; }
  body { height: 3000px; font: 17px/25px system-ui; -webkit-text-size-adjust: 100%; }
  nav { height: 48px; background-color: rgb(255 255 255 / 0.8); }
  #list {
    position: static; inset: auto; width: auto; height: 48px; margin: 0; padding: 0; border: 0;
    overflow: visible; color: inherit; background-color: transparent;
    display: flex; flex-flow: row wrap; list-style: none;
  }
  #list > li { height: 48px; }
  #list > .row { display: none; flex-basis: 100%; height: auto; }
  #list:popover-open {
    position: fixed; inset: 0; height: 100%; overflow-y: auto; overscroll-behavior: contain;
    background-color: #fafafc;
    transition: height 450ms cubic-bezier(0.4, 0, 0.6, 1), background-color 450ms cubic-bezier(0.4, 0, 0.6, 1);
  }
  #list:popover-open > .row {
    display: block;
    transition: opacity 240ms cubic-bezier(0.4, 0, 0.6, 1) 200ms, transform 240ms cubic-bezier(0.4, 0, 0.6, 1) 200ms;
  }
  @starting-style {
    #list:popover-open > .row { opacity: 0; transform: translateY(-8px); }
  }
  html:has(#list:popover-open) { overflow: hidden; }
  #button { margin-left: auto; width: 48px; height: 48px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #000; }
  #button path { transition: transform 240ms cubic-bezier(0.4, 0, 0.6, 1); }
  #button path:first-child { transform-origin: 9px 5px; }
  #button path:last-child { transform-origin: 9px 12px; }
  #list:popover-open #button path:first-child { transform: translate(0.25px, 4.25px) rotate(45deg) scaleX(1.16168); }
  #list:popover-open #button path:last-child { transform: translate(0.25px, -2.75px) rotate(-45deg) scaleX(1.16168); }
</style>
</head>
<body>
<nav>
  <ul id="list" popover>
    <li><a href="#home">Logo</a></li>
    <li><button id="button" popovertarget="list" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5H16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M2 12H16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button></li>
    <li class="row"><a href="#one">One</a></li>
    <li class="row"><a href="#two">Two</a></li>
  </ul>
</nav>
<p>The page.</p>
</body>
</html>
